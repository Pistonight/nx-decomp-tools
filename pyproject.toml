[project]
name = "nx-decomp-tools"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "capstone>=5.0.9",
    "colorama>=0.4.6",
    "cxxfilt>=0.3.0",
    "gitpython>=3.1.62",
    "python-levenshtein>=0.27.5",
    "toml>=0.10.2",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
